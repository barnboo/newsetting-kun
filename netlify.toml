[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy API requests to backend server (Update with your actual Render URL)
[[redirects]]
  from = "/api/*"
  to = "https://stajet.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "https://stajet.onrender.com/static/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
